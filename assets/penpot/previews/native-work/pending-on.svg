<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="100%" height="100%" fill="#061629"/><rect x="0" y="0" width="76" height="1024" rx="0" fill="#0C2050"/><foreignObject x="23" y="23" width="40" height="42.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:400;line-height:1.4;color:#67D8EA;overflow-wrap:break-word">✦</div></foreignObject><foreignObject x="24" y="112" width="34" height="35.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">⌂</div></foreignObject><foreignObject x="24" y="188" width="34" height="35.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">∿</div></foreignObject><foreignObject x="24" y="264" width="34" height="35.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">▤</div></foreignObject><foreignObject x="24" y="340" width="34" height="35.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">⚙</div></foreignObject><foreignObject x="112" y="28" width="800" height="32.199999999999996"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Kinaiya / Converse</div></foreignObject><foreignObject x="1210" y="34" width="290" height="19.599999999999998"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:700;line-height:1.4;color:#E9C081;overflow-wrap:break-word">ILLUSTRATIVE DESIGN</div></foreignObject><foreignObject x="112" y="92" width="1250" height="44.8"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:32px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Agent working · follow-up pending</div></foreignObject><foreignObject x="112" y="140" width="1290" height="25.2"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Native facts, model dialogue and planned UI remain separate.</div></foreignObject><foreignObject x="112" y="984" width="1300" height="19.599999999999998"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Prototype navigation only. No runtime settings, task effects or device access.</div></foreignObject><rect x="112" y="200" width="836" height="700" rx="16" fill="#0C2038"/><foreignObject x="140" y="225" width="760" height="33.599999999999994"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Conversation</div></foreignObject><foreignObject x="142" y="285" width="730" height="22.4"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">You</div></foreignObject><rect x="140" y="316" width="780" height="108" rx="16" fill="#122E4C"/><foreignObject x="160" y="338" width="738" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:21px;font-weight:400;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Add a flashlight and spare socks to that request.</div></foreignObject><foreignObject x="142" y="459" width="730" height="22.4"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Kinaiya · generated dialogue</div></foreignObject><rect x="140" y="492" width="780" height="160" rx="16" fill="#122E4C"/><foreignObject x="160" y="515" width="736" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:400;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">I heard the change. You can keep talking while Agent works.</div></foreignObject><foreignObject x="142" y="690" width="742" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Dialogue expresses the character. It does not establish a tool effect.</div></foreignObject><rect x="976" y="200" width="448" height="700" rx="16" fill="#0C2038"/><foreignObject x="1000" y="225" width="402" height="33.599999999999994"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Agent observations</div></foreignObject><foreignObject x="1000" y="287" width="402" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;line-height:1.4;color:#67D8EA;overflow-wrap:break-word">Running · revision 1</div></foreignObject><foreignObject x="1000" y="384" width="402" height="210"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:19px;font-weight:400;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Native acceptance observed<br/>Follow-up steering pending<br/>Revision 2 is not applied<br/>No program receipt observed</div></foreignObject><rect x="994" y="640" width="412" height="216" rx="16" fill="#122E4C"/><foreignObject x="1010" y="660" width="378" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:19px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">A steering receipt is distinct from an<br/>applied objective revision or tool effect.</div></foreignObject><rect x="112" y="926" width="260" height="44" rx="12" fill="#122E4C"/><foreignObject x="128" y="934" width="228" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Design index</div></foreignObject><rect x="1130" y="926" width="294" height="44" rx="12" fill="#67D8EA"/><foreignObject x="1146" y="934" width="262" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#061629;overflow-wrap:break-word">Next task state</div></foreignObject></svg>