<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900"><rect width="100%" height="100%" fill="#061629"/><foreignObject x="24" y="28" width="240" height="36.4"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Kinaiya</div></foreignObject><foreignObject x="24" y="69" width="350" height="18.2"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:700;line-height:1.4;color:#E9C081;overflow-wrap:break-word">DESIGN · PLANNED</div></foreignObject><foreignObject x="24" y="112" width="372" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:27px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Offline transcript catch-up</div></foreignObject><rect x="20" y="220" width="380" height="154" rx="16" fill="#0C2038"/><foreignObject x="38" y="234" width="344" height="28.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Offline · saved transcript</div></foreignObject><foreignObject x="38" y="271" width="344" height="47.599999999999994"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Read the local transcript while<br/>disconnected. Queued text is visible.</div></foreignObject><rect x="20" y="394" width="380" height="154" rx="16" fill="#0C2038"/><foreignObject x="38" y="408" width="344" height="28.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Reconnect from receipt</div></foreignObject><foreignObject x="38" y="445" width="344" height="71.39999999999999"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Resume from the last confirmed<br/>journal position. Preserve message<br/>identity; do not duplicate dispatch.</div></foreignObject><rect x="20" y="568" width="380" height="154" rx="16" fill="#0C2038"/><foreignObject x="38" y="582" width="344" height="28.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Incomplete catch-up</div></foreignObject><foreignObject x="38" y="619" width="344" height="71.39999999999999"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Show a visible gap if history is<br/>unavailable. Never claim the full<br/>transcript was synchronized.</div></foreignObject><foreignObject x="24" y="800" width="370" height="21.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Illustrative public content only.</div></foreignObject><rect x="24" y="838" width="360" height="44" rx="12" fill="#122E4C"/><foreignObject x="40" y="846" width="328" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Back to design index</div></foreignObject></svg>