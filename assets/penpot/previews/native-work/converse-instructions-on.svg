oreignObject><foreignObject x="112" y="92" width="1250" height="44.8"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:32px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Converse instructions</div></foreignObject><foreignObject x="112" y="140" width="1290" height="25.2"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Native facts, model dialogue and planned UI remain separate.</div></foreignObject><foreignObject x="112" y="984" width="1300" height="19.599999999999998"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Prototype navigation only. No runtime settings, task effects or device access.</div></foreignObject><rect x="112" y="200" width="285" height="700" rx="16" fill="#0C2038"/><rect x="128" y="224" width="253" height="44" rx="12" fill="#67D8EA"/><foreignObject x="144" y="232" width="221" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#061629;overflow-wrap:break-word">Converse instructions</div></foreignObject><rect x="128" y="298" width="253" height="44" rx="12" fill="#122E4C"/><foreignObject x="144" y="306" width="221" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Decisions instructions</div></foreignObject><rect x="128" y="372" width="253" height="44" rx="12" fill="#122E4C"/><foreignObject x="144" y="380" width="221" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Voice &amp; audio</div></foreignObject><rect x="128" y="446" width="253" height="44" rx="12" fill="#122E4C"/><foreignObject x="144" y="454" width="221" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Readiness</div></foreignObject><rect x="128" y="520" width="253" height="44" rx="12" fill="#122E4C"/><foreignObject x="144" y="528" width="221" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Components</div></foreignObject><rect x="128" y="594" width="253" height="44" rx="12" fill="#122E4C"/><foreignObject x="144" y="602" width="221" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Saved creations</div></foreignObject><rect x="425" y="200" width="999" height="700" rx="16" fill="#0C2038"/><foreignObject x="455" y="229" width="930" height="36.4"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Your natural-language instructions</div></foreignObject><foreignObject x="455" y="276" width="930" height="25.2"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:400;line-height:1.4;color:#67D8EA;overflow-wrap:break-word">Editable preference · Converse</div></foreignObject><rect x="453" y="326" width="941" height="230" rx="16" fill="#122E4C"/><foreignObject x="475" y="351" width="894" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:400;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Acknowledge delegated work briefly and await Agent’s substantive answer.<br/>Keep listening, accept corrections, and talk naturally about other topics.</div></foreignObject><foreignObject x="455" y="590" width="920" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:19px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Model behavior is a preference. Instructions cannot grant tools or prove success.</div></foreignObject><foreignObject x="455" y="682" width="920" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:400;line-height:1.4;color:#E9C081;overflow-wrap:break-word">Host configuration is implemented in draft #589.<br/>This visual editor is proposed; no Save action changes the running host.</div></foreignObject><foreignObject x="455" y="796" width="920" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:400;line-height:1.4;color:#A6BAD6;overflow-wrap:break-word">Custom text may be empty. Omission restores the built-in default.<br/>Choose disclosure deliberately; custom instructions default to local-only.</div></foreignObject><rect x="112" y="926" width="285" height="44" rx="12" fill="#122E4C"/><foreignObject x="128" y="934" width="253" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;line-height:1.4;color:#F3F6FF;overflow-wrap:break-word">Design index</div></foreignObject></svg>