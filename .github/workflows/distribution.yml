name: distribution
on:
  schedule:
    - cron: '0 0 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate workflow artifacts only; never publish or attest
        type: boolean
        default: true
      channel:
        description: Stable requires a qualified final tag and independent approval
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: Base X.Y.Z (not an alpha/prerelease version)
        type: string
        default: '0.1.0'
      tag:
        description: Existing vX.Y.Z tag for stable; leave empty for nightly
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: kinaiya-distribution
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'rgoza1996/Kinaiya' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.gate.outputs.channel }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
      build_number: ${{ steps.gate.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Qualify exact source and publishing protections
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
        run: python -m scripts.release_gate --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release engineering contracts
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pytest tests/unit/test_distribution_*.py -q
      - name: Install pinned official Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin refs/tags/3.47.8:refs/tags/3.47.8
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse refs/tags/3.47.8)" = 737ba8f885dc774b53b442759999a312c9461e4e
          git -C "$RUNNER_TEMP/flutter" checkout --detach 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Build matching prebuilt web client
        working-directory: apps/kinaiya_flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build web --release --no-web-resources-cdn --dart-define="KINAIYA_VERSION=$VERSION" --dart-define="KINAIYA_CHANNEL=$CHANNEL" --dart-define="KINAIYA_BUILD_NUMBER=$BUILD_NUMBER" --dart-define="KINAIYA_SOURCE_SHA=$SOURCE_SHA"
      - name: Bundle twice and compare deterministic bytes
        run: |
          python -m scripts.build_release --output dist --channel "$CHANNEL" --version "$VERSION" --build-number "$BUILD_NUMBER" --source-sha "$SOURCE_SHA" --web-dir apps/kinaiya_flutter/build/web --web-source-sha "$SOURCE_SHA"
          python -m scripts.build_release --output "$RUNNER_TEMP/repro" --channel "$CHANNEL" --version "$VERSION" --build-number "$BUILD_NUMBER" --source-sha "$SOURCE_SHA" --web-dir apps/kinaiya_flutter/build/web --web-source-sha "$SOURCE_SHA"
          diff --recursive dist "$RUNNER_TEMP/repro"
          python -m scripts.build_release --validate dist
          python - <<'PY'
          from pathlib import Path
          from scripts.build_release import validate_bundle
          from packages.distribution.releases import select_artifact
          data = validate_bundle('dist')
          select_artifact(data, 'web', 'any')
          notes = f"# Kinaiya {data['version']} ({data['channel']})\n\nSource: `{data['source_sha']}`; build {data['build_number']}.\n\n"
          notes += 'Experimental Linux source/runtime-lock and matching web assets. Mobile client files, when present, are listed below and in mobile-manifest.json; there is no Play Store, App Store or TestFlight distribution. Voice/calling/provider and production qualification remain separate gates; this does not close #11 or #13. See docs/releases.md and docs/mobile-distribution.md for compatibility, trust, recovery and blocked platform acceptance.\n'
          Path('dist/release-notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: Retain nonpublishing validation or release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ needs.prepare.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  mobile-android:
    # Signed APKs only: the distribution key lives in the protected release-<channel>
    # environment. Without it this job publishes nothing (and says so) instead of
    # substituting a debug or ad hoc key. Dry runs never receive signing secrets.
    needs: prepare
    if: needs.prepare.outputs.dry_run == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: ${{ format('release-{0}', needs.prepare.outputs.channel) }}
    permissions:
      contents: read
    outputs:
      built: ${{ steps.apk.outputs.built }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select hosted JDK and Android NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          if test ! -d "$ANDROID_HOME/ndk/28.2.13676358"; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" </dev/null
          fi
      - name: Install pinned official Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin refs/tags/3.47.8:refs/tags/3.47.8
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse refs/tags/3.47.8)" = 737ba8f885dc774b53b442759999a312c9461e4e
          git -C "$RUNNER_TEMP/flutter" checkout --detach 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build signed APKs when distribution signing is configured
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KINAIYA_ANDROID_KEYSTORE_BASE64 }}
          KINAIYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KINAIYA_ANDROID_KEYSTORE_PASSWORD }}
          KINAIYA_ANDROID_KEY_ALIAS: ${{ secrets.KINAIYA_ANDROID_KEY_ALIAS }}
          KINAIYA_ANDROID_KEY_PASSWORD: ${{ secrets.KINAIYA_ANDROID_KEY_PASSWORD }}
          KINAIYA_ANDROID_CERT_SHA256: ${{ vars.KINAIYA_ANDROID_CERT_SHA256 }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if test -z "$KEYSTORE_BASE64"; then
            echo "::warning::Android distribution signing is not configured for release-$CHANNEL; this release has no APK."
            echo built=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The public certificate fingerprint pins the identity every update must keep.
          test -n "$KINAIYA_ANDROID_CERT_SHA256"
          (cd apps/kinaiya_flutter && flutter pub get --enforce-lockfile)
          umask 077
          export KINAIYA_ANDROID_KEYSTORE="$RUNNER_TEMP/distribution.jks"
          trap 'rm -f "$KINAIYA_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KINAIYA_ANDROID_KEYSTORE"
          base="${VERSION%%-*}"
          for app in kinaiya companion; do
            python -m scripts.mobile_build --platform android --app "$app" --channel "$CHANNEL" \
              --version "$base" --build-number "$BUILD_NUMBER" --source-sha "$SOURCE_SHA" \
              --output "$RUNNER_TEMP/mobile-android"
          done
          echo built=true >> "$GITHUB_OUTPUT"
      - name: Retain signed APK candidates
        if: steps.apk.outputs.built == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-android-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/mobile-android/*
          if-no-files-found: error
          retention-days: 30

  mobile-ios:
    # Unsigned IPAs for sideloading tools that re-sign with the installer's Apple ID.
    # No Apple credentials exist in this workflow; nothing is notarized or uploaded.
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      VERSION: ${{ needs.prepare.outputs.version }}
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      FLUTTER_SWIFT_PACKAGE_MANAGER: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Select hosted Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Install pinned official Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin refs/tags/3.47.8:refs/tags/3.47.8
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse refs/tags/3.47.8)" = 737ba8f885dc774b53b442759999a312c9461e4e
          git -C "$RUNNER_TEMP/flutter" checkout --detach 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build unsigned sideload IPAs
        run: |
          (cd apps/kinaiya_flutter && flutter pub get --enforce-lockfile)
          base="${VERSION%%-*}"
          for app in kinaiya companion; do
            python3 -m scripts.mobile_build --platform ios --app "$app" --channel "$CHANNEL" \
              --version "$base" --build-number "$BUILD_NUMBER" --source-sha "$SOURCE_SHA" \
              --output "$RUNNER_TEMP/mobile-ios"
          done
      - name: Retain IPA candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-ios-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/mobile-ios/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, build, mobile-android, mobile-ios]
    if: >-
      needs.prepare.outputs.dry_run == 'false' &&
      github.repository == 'rgoza1996/Kinaiya' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: ${{ format('release-{0}', needs.prepare.outputs.channel) }}
    permissions:
      contents: write
      attestations: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: rgoza1996/Kinaiya
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.prepare.outputs.tag }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mobile-ios-${{ needs.prepare.outputs.tag }}
          path: dist-mobile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.mobile-android.outputs.built == 'true'
        with:
          name: mobile-android-${{ needs.prepare.outputs.tag }}
          path: dist-mobile
      - name: Verify mobile candidates and add them to the bundle
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          ANDROID_BUILT: ${{ needs.mobile-android.outputs.built }}
        run: |
          python -m scripts.mobile_build --merge --output dist-mobile --channel "$CHANNEL" \
            --build-number "$BUILD_NUMBER" --source-sha "$SOURCE_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('dist-mobile/mobile-manifest.json').read_text())
          platforms = {a['platform'] for a in manifest['artifacts']}
          assert ('android' in platforms) == (os.environ['ANDROID_BUILT'] == 'true'), platforms
          assert 'ios' in platforms, platforms
          lines = ['', '## Mobile clients', '']
          for a in manifest['artifacts']:
              kind = 'signed APK' if a['signing']['kind'] == 'android-distribution' else 'unsigned IPA for sideloading tools'
              cert = a['signing']['certificate_sha256']
              lines.append(f"- `{a['name']}`: {a['app']} {a['platform']} {kind}, `{a['application_id']}`, SHA-256 `{a['sha256']}`" + (f", signing certificate SHA-256 `{cert}`" if cert else ''))
          if 'android' not in platforms:
              lines.append('- Android: not included; distribution signing was not configured for this release.')
          lines.append('')
          lines.append('Install/update guidance and limits: docs/mobile-distribution.md. Emulator/simulator checks are not physical-device qualification.')
          with Path('dist/release-notes.md').open('a', encoding='utf-8') as notes:
              notes.write('\n'.join(lines) + '\n')
          PY
          for file in dist-mobile/*; do
            test ! -e "dist/$(basename "$file")"
            mv "$file" dist/
          done
      - name: Recheck qualification after environment approval
        run: |
          git fetch origin main --tags
          python -m scripts.release_gate --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/final-gate"
          grep -Fx "source_sha=$SOURCE_SHA" "$RUNNER_TEMP/final-gate"
          python -m scripts.build_release --validate dist
          python - <<'PY'
          import os
          from scripts.build_release import validate_bundle
          from packages.distribution.releases import release_tag, select_artifact
          data = validate_bundle('dist')
          assert data['source_sha'] == os.environ['SOURCE_SHA']
          assert data['channel'] == os.environ['CHANNEL']
          assert release_tag(data) == os.environ['TAG']
          select_artifact(data, 'web', 'any')
          PY
      - name: Attest complete bundle
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
      - name: Stage draft release
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release, including a previous draft.' >&2
            exit 1
          fi
          flags=(--draft --latest=false --target "$SOURCE_SHA" --title "Kinaiya $TAG" --notes-file dist/release-notes.md)
          if test "$CHANNEL" = stable; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
            flags+=(--verify-tag)
          else
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" > "$RUNNER_TEMP/tag-check"
            status=$?
            set -e
            test "$status" = 2 # 0 means reused identity; other errors are not absence.
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --repo "$REPOSITORY" "${flags[@]}"
      - name: Verify staged bytes and attestations
        run: |
          release_id=$(gh release view "$TAG" --repo "$REPOSITORY" --json databaseId --jq .databaseId)
          gh api "repos/$REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/staged.json"
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.draft == true and .tag_name == $tag and .target_commitish == $sha and all(.assets[]; .state == "uploaded")' "$RUNNER_TEMP/staged.json"
          gh release download "$TAG" --repo "$REPOSITORY" --dir "$RUNNER_TEMP/staged-release"
          python -m scripts.build_release --validate "$RUNNER_TEMP/staged-release"
          diff --recursive dist "$RUNNER_TEMP/staged-release"
          for file in "$RUNNER_TEMP/staged-release"/*; do
            gh attestation verify "$file" --repo "$REPOSITORY" --cert-identity "https://github.com/$REPOSITORY/.github/workflows/distribution.yml@refs/heads/main" --deny-self-hosted-runners
          done
      - name: Publish complete release
        run: |
          if test "$CHANNEL" = stable; then
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --prerelease=true --latest=false
          fi
      - name: Read back published release
        run: |
          gh api "repos/$REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from packages.distribution.releases import ROOT
          from scripts.build_release import validate_bundle
          published = json.loads((Path(os.environ['RUNNER_TEMP']) / 'published.json').read_text())
          data = validate_bundle('dist')
          assert published['draft'] is False
          assert published['prerelease'] is (data['channel'] == 'nightly')
          assert published['tag_name'] == os.environ['TAG']
          assert published['target_commitish'] == data['source_sha']
          assets = {a['name']: a for a in published['assets']}
          assert set(assets) == {p.name for p in Path('dist').iterdir()}
          for path in Path('dist').iterdir():
              asset = assets[path.name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['browser_download_url'] == f"{ROOT}/download/{os.environ['TAG']}/{path.name}"
          PY
