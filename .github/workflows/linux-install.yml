name: linux-install-qualification
# Real installer lifecycle on hosted native Ubuntu VMs (#261). Each job builds local,
# unqualified fixtures from the exact checkout and drives the production installer:
# preflight, install, rerun, interrupted-update recovery, concurrency, update,
# dirty/downgrade refusal, Agent sandbox denials, service health/auth/lock,
# rollback and data-preserving uninstall. No publishing, provider calls or tasks.
on:
  pull_request:
    paths:
      - install.sh
      - requirements-runtime.lock
      - packages/distribution/**
      - services/distribution/**
      - services/launcher.py
      - services/agent/tools.py
      - core/policy.py
      - scripts/build_release.py
      - scripts/qualify_linux_install.py
      - .github/workflows/linux-install.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - requirements-runtime.lock
      - packages/distribution/**
      - services/distribution/**
      - scripts/qualify_linux_install.py
      - .github/workflows/linux-install.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: ${{ matrix.runner }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            python: '3.11'
          - runner: ubuntu-22.04-arm
            python: '3.11'
          - runner: ubuntu-24.04
            python: '3.12'
          - runner: ubuntu-24.04-arm
            python: '3.12'
          - runner: ubuntu-24.04
            python: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install documented sandbox prerequisites on this ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap libseccomp2
          bwrap --version
          uname -srm
          cat /etc/os-release | grep -E '^(ID|VERSION_ID)='
          # Recorded, never changed: a denied namespace probe must fail this job.
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
      - name: Qualify installer lifecycle
        run: |
          python -m scripts.qualify_linux_install \
            --root "$RUNNER_TEMP/kinaiya-qualify" \
            --evidence "$RUNNER_TEMP/evidence/linux-install-${{ matrix.runner }}-py${{ matrix.python }}.json"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-install-${{ matrix.runner }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
