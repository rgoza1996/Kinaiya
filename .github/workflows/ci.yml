name: deterministic-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Verify Linux sandbox prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap libseccomp2
          python - <<'PY'
          import ctypes, subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from core.policy import ToolPolicy
          from services.agent.tools import build_bwrap_args
          ctypes.CDLL('libseccomp.so.2')
          with TemporaryDirectory() as workspace:
              argv, isolated = build_bwrap_args(ToolPolicy(Path(workspace)), 'true', False)
              assert isolated
              subprocess.run(argv, check=True, timeout=15)
          PY
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m 'not live' -q
      - run: python scripts/export_contracts.py && git diff --exit-code packages/contracts/schemas
      - name: Dependency audit
        run: python -m pip_audit -r requirements-dev.lock --disable-pip

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/kinaiya_flutter
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Flutter SDK
        working-directory: .
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin refs/tags/3.47.8:refs/tags/3.47.8
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse refs/tags/3.47.8)" = 737ba8f885dc774b53b442759999a312c9461e4e
          git -C "$RUNNER_TEMP/flutter" checkout --detach 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: node --test web/audio_bridge.test.js
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: kinaiya-flutter-web
          path: apps/kinaiya_flutter/build/web
          if-no-files-found: error
