name: temporary-runner-policy-negative-probe
on:
  pull_request:
    paths:
      - .github/workflows/runner-policy-probe.yml
      - .github/actions/runner-policy-probe/**
permissions:
  contents: read
jobs:
  refused-pr:
    strategy:
      fail-fast: false
      matrix:
        arch: [ARM64, X64]
    runs-on: [self-hosted, Linux, '${{ matrix.arch }}', kinaiya-ci]
    timeout-minutes: 3
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: rgoza1996/Kinaiya/.github/actions/runner-policy-probe@codex/self-hosted-ci-379
      - if: always()
        run: echo UNSAFE_ALWAYS_REACHED
